services:
  - type: web
    name: app-monitoramento
    runtime: node
    buildCommand: npm install && npm run install:all && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_FILE
        value: /tmp/monitoramento.sqlite
      - key: JWT_SECRET
        generateValue: true
